        description: Google Pub/Sub Delete a subscription
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: subscription
          in: path
          type: string
          required: true
